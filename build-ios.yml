
name: Build NumberGen iOS

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build iOS app
        run: |
          xcodebuild \
            -project NumberGenPrototype.xcodeproj \
            -scheme NumberGenPrototype \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build/DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Package IPA
        run: |
          mkdir -p build/Payload
          cp -R build/DerivedData/Build/Products/Release-iphoneos/NumberGenPrototype.app build/Payload/
          cd build
          zip -r NumberGenPrototype-unsigned.ipa Payload

      - uses: actions/upload-artifact@v4
        with:
          name: NumberGenPrototype-unsigned-ipa
          path: build/NumberGenPrototype-unsigned.ipa
